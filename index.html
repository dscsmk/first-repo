<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종합 퀴즈 — AI / ML / NLP [123]</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --bg-accent: #e7efe8;
      --ink: #1c2420;
      --muted: #5a665f;
      --line: #c9d0c8;
      --card: #fffcf6;
      --accent: #0f6b4c;
      --accent-soft: #d8efe5;
      --wrong: #9b2c2c;
      --wrong-soft: #fde8e8;
      --ok: #0f6b4c;
      --ok-soft: #d8efe5;
      --shadow: 0 10px 30px rgba(28, 36, 32, 0.08);
      --radius: 18px;
      --font: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      --display: "Fraunces", "Noto Serif KR", Georgia, serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d9ebe2 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #f0e2cf 0%, transparent 50%),
        linear-gradient(180deg, var(--bg), var(--bg-accent));
      min-height: 100vh;
    }

    .wrap {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 80px;
    }

    header.hero {
      padding: 28px 0 18px;
      animation: rise 0.6s ease both;
    }
    .eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.15;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0;
      max-width: 42rem;
      line-height: 1.55;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(243, 240, 232, 0.85);
      border: 1px solid rgba(201, 208, 200, 0.7);
      border-radius: 16px;
      padding: 12px;
      margin: 22px 0 18px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 10px;
      animation: rise 0.7s ease both;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tab, .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .tab:hover, .btn:hover { transform: translateY(-1px); }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .actions-left, .actions-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .btn.ghost { background: transparent; }
    .score {
      font-size: 0.92rem;
      color: var(--muted);
      font-weight: 600;
    }
    .score strong { color: var(--accent); font-size: 1.05rem; }

    .progress {
      height: 8px;
      background: #e4e8e3;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #178a61, #0f6b4c);
      transition: width 0.35s ease;
    }

    .section-title {
      font-family: var(--display);
      font-size: 1.25rem;
      margin: 28px 0 12px;
      letter-spacing: -0.01em;
    }

    .quiz {
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(201, 208, 200, 0.85);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      animation: rise 0.45s ease both;
    }
    .card.is-hidden { display: none; }
    .q-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef2ef;
      color: var(--muted);
    }
    .badge.type-mc { background: #e7f2ec; color: var(--accent); }
    .badge.type-ox { background: #efe8f8; color: #5b3d8a; }
    .badge.type-desc { background: #f7ebe0; color: #8a4b1f; }
    .badge.type-multi { background: #e8eef8; color: #2f4f8a; }
    .badge.result-ok { background: var(--ok-soft); color: var(--ok); }
    .badge.result-bad { background: var(--wrong-soft); color: var(--wrong); }
    .badge.result-pending { background: #f0efe8; color: #6a6558; }

    .q-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      margin: 0 0 12px;
      white-space: pre-wrap;
    }
    .q-extra {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
      margin: -4px 0 12px;
      white-space: pre-wrap;
    }

    .options {
      display: grid;
      gap: 8px;
    }
    .option {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 11px 12px;
      cursor: pointer;
      font: inherit;
      line-height: 1.4;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }
    .option:hover:not(:disabled) {
      border-color: #8fb8a5;
      transform: translateY(-1px);
    }
    .option .mark {
      flex: 0 0 auto;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      border: 1.5px solid #a8b5ad;
      display: grid;
      place-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 1px;
    }
    .option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .option.selected .mark {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .option.correct {
      border-color: var(--ok);
      background: var(--ok-soft);
    }
    .option.correct .mark {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }
    .option.wrong {
      border-color: var(--wrong);
      background: var(--wrong-soft);
    }
    .option.wrong .mark {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #fff;
    }
    .option:disabled { cursor: default; }

    .desc-box, .multi-input {
      width: 100%;
      min-height: 110px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      font: inherit;
      resize: vertical;
      background: #fff;
      color: var(--ink);
    }
    .multi-input { min-height: 44px; }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .feedback {
      margin-top: 12px;
      border-radius: 14px;
      padding: 12px 14px;
      display: none;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .feedback.show { display: block; animation: fade 0.25s ease; }
    .feedback.ok {
      background: var(--ok-soft);
      border: 1px solid #b7dccb;
      color: #134d38;
    }
    .feedback.bad {
      background: var(--wrong-soft);
      border: 1px solid #efc0c0;
      color: #6e1f1f;
    }
    .feedback.info {
      background: #f4f1ea;
      border: 1px solid #ddd5c5;
      color: #3d372c;
    }
    .feedback .label {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .group-block {
      border: 1px dashed #c8d2cb;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }
    .group-block h4 {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }

    footer.note {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(100% - 20px, 920px); }
      .card { padding: 16px 14px; }
      .actions { align-items: stretch; }
      .actions-left, .actions-right { width: 100%; }
      .btn, .tab { flex: 1 1 auto; text-align: center; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650;9..144,700&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">종합 복습 퀴즈</div>
      <h1>AI · 기계학습 · NLP  [123]</h1>
      <p class="sub">선택지를 고른 뒤 각 문제의 「정답 확인」으로 바로 채점하세요. 상단에서 카테고리 필터와 일괄 채점도 가능합니다.</p>
    </header>

    <div class="toolbar">
      <div class="tabs" id="tabs"></div>
      <div class="actions">
        <div class="actions-left">
          <div class="score">채점 가능 <strong id="gradableCount">0</strong> · 맞춤 <strong id="correctCount">0</strong> · 틀림 <strong id="wrongCount">0</strong> · 미채점 <strong id="pendingCount">0</strong></div>
        </div>
        <div class="actions-right">
          <button class="btn ghost" id="btnReset" type="button">초기화</button>
          <button class="btn" id="btnRevealAll" type="button">전부 해설 보기</button>
          <button class="btn primary" id="btnGradeAll" type="button">전부 채점</button>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
    </div>

    <div id="quizRoot" class="quiz"></div>
    <footer class="note"> 우리반 화이팅~! 만점 가즈아~!!! </footer>
  </div>

  <script>
    const QUIZ = [
      {
        id: "1-1-q1", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q1",
        question: "AI, ML, DL의 관계에 대한 설명으로 옳은 것은?",
        options: [
          { key: "1", text: "ML은 AI와 DL의 상위 개념이다." },
          { key: "2", text: "AI는 반드시 ML을 사용해야 한다." },
          { key: "3", text: "ML은 AI의 한 부분으로, 데이터로부터 학습을 수행한다." },
          { key: "4", text: "규칙 기반 시스템은 ML의 한 분야이다." },
          { key: "5", text: "ML은 사람이 직접 코딩한 규칙을 그대로 사용하는 방식이다." }
        ],
        answer: "3",
        explain: "ML은 AI의 한 분야로, 데이터로부터 규칙을 학습해 목표 달성을 돕는다.\n- ①: ML은 AI의 하위 개념이다.\n- ②: AI는 규칙/휴리스틱 기반만으로도 구현 가능하다.\n- ④: 규칙 기반 시스템은 AI의 대표적인 예시이다.\n- ⑤: ML은 데이터에서 추론한다."
      },
      {
        id: "1-1-q2", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q2",
        question: "Feature와 Label에 대한 설명으로 옳지 않은 것은?",
        options: [
          { key: "1", text: "Feature는 모델이 예측에 사용하는 입력 정보이다." },
          { key: "2", text: "Label은 모델이 예측하려는 정답, 즉 학습의 목표이다." },
          { key: "3", text: "Feature와 Label의 분포와 관계가 학습 결과를 결정한다." },
          { key: "4", text: "Feature는 반드시 수치형 데이터만 될 수 있다." },
          { key: "5", text: "Label은 분류 문제에서는 카테고리, 회귀 문제에서는 수치값이 될 수 있다." }
        ],
        answer: "4",
        explain: "Feature는 수치형뿐 아니라 범주형, 텍스트, 이미지/음성 등도 가능하다."
      },
      {
        id: "1-1-q3", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q3",
        question: "미지의 참 함수 f(X)를 학습하는 이유로 적절하지 않은 것은?",
        options: [
          { key: "1", text: "Feature(X)와 Label(Y) 사이의 관계를 알기 위해" },
          { key: "2", text: "모든 데이터의 측정오차(ε)를 제거하기 위해" },
          { key: "3", text: "새로운 입력 X에 대해 목표값 Y를 예측하기 위해" },
          { key: "4", text: "여러 Feature(X) 중 Label(Y)과 관계를 갖고 있는 Feature를 알기 위해" },
          { key: "5", text: "Feature(X) 값의 변화에 따라서 Label(Y)이 어떻게 변화하는지 알기 위해" }
        ],
        answer: "2",
        explain: "학습을 잘 한다고 하여 측정오차를 줄이거나 제거할 수 없다."
      },
      {
        id: "1-1-q4", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q4",
        question: "지도학습(Supervised Learning)에 대한 설명으로 옳은 것은?",
        options: [
          { key: "1", text: "입력 데이터만 있고 정답(라벨)이 없는 데이터로 학습한다." },
          { key: "2", text: "새로운 입력에 대해 정답을 잘 맞추는 함수를 학습한다." },
          { key: "3", text: "오버피팅은 훈련 데이터에서의 오류를 최대한 줄이는 것으로 학습이 목표하는 방향이다." },
          { key: "4", text: "지도학습 모델의 출력은 반드시 범주(카테고리)이다." },
          { key: "5", text: "지도학습은 측정오차를 최소화하는 것이 목적이다." }
        ],
        answer: "2",
        explain: "지도학습은 입력(특성)과 정답(라벨)이 쌍으로 있는 데이터를 학습하여 새로운 입력의 정답을 맞추는 규칙을 찾는다.\n- ①: 입력만 있고 정답이 없는 경우는 비지도 학습이다.\n- ③: 일반화 성능을 높이는 것이 궁극적인 목적이기에 오버피팅은 피해야 한다.\n- ④: 지도학습 모델 출력은 수치(회귀)와 범주(분류) 모두 가능하다.\n- ⑤: 예측값과 정답의 차이(오차)를 줄이는 것이 핵심이다."
      },
      {
        id: "1-1-q5", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q5",
        question: "회귀(Regression) 문제의 특징으로 옳은 것은?",
        options: [
          { key: "1", text: "스팸/정상 분류와 같은 범주 예측 문제를 다룬다." },
          { key: "2", text: "예측값은 연속적인 숫자(예: 가격, 점수, 온도)로 나온다." },
          { key: "3", text: "대표적인 성능 지표는 정확도(Accuracy)이다." },
          { key: "4", text: "예측 결과는 이산적인 값으로 한정된다." },
          { key: "5", text: "훈련 데이터와 테스트 데이터의 분포가 다르면 반드시 발생한다." }
        ],
        answer: "2",
        explain: "회귀 문제는 연속적인 수치를 예측하는 문제다 (집값, 매출액, 온도 등).\n- ①: 범주를 예측하는 것은 분류(Classification) 문제다.\n- ③: 회귀에서는 MSE, RMSE, R² 등의 지표를 사용한다.\n- ④: 이산 값은 분류 문제의 특징이다."
      },
      {
        id: "1-1-q6", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q6",
        question: "혼동행렬에 대한 설명으로 옳지 않은 것은?",
        options: [
          { key: "1", text: "TP(True Positive): 실제 양성을 양성으로 예측한 경우" },
          { key: "2", text: "TN(True Negative): 실제 음성을 음성으로 예측한 경우" },
          { key: "3", text: "FP(False Positive): 실제 음성인데 양성으로 잘못 예측한 경우" },
          { key: "4", text: "FN(False Negative): 실제 양성인데 음성으로 잘못 예측한 경우" },
          { key: "5", text: "혼동행렬은 회귀 문제의 성능 평가에서 사용된다." }
        ],
        answer: "5",
        explain: "혼동행렬은 분류 문제의 성능 평가 지표이다. 회귀 문제에서는 MSE, RMSE, R² 등의 지표를 사용한다."
      },
      {
        id: "1-1-q7", section: "1-1", sectionTitle: "1-1 AI & 기계학습 기초",
        type: "mc", label: "Q7",
        question: "훈련 오류와 테스트 오류에 대한 설명으로 옳은 것은?",
        options: [
          { key: "1", text: "훈련 오류는 새로운 데이터에 대한 예측 정확도를 측정한다." },
          { key: "2", text: "테스트 오류는 학습에 사용된 데이터에 대해 계산한 평균 오차이다." },
          { key: "3", text: "궁극적으로 테스트 오류를 최소화하는 것이 학습의 목적이다." },
          { key: "4", text: "일반적으로 훈련 오류는 테스트 오류보다 크게 나타난다." },
          { key: "5", text: "훈련 오류는 항상 0에 수렴해야 좋은 모델이다." }

    ];

    const state = {
      filter: "all",
      answers: {},
      graded: {}
    };

    const root = document.getElementById("quizRoot");
    const tabs = document.getElementById("tabs");

    function typeLabel(type) {
      if (type === "mc") return "객관식";
      if (type === "ox") return "O/X";
      if (type === "desc") return "서술형";
      if (type === "multi") return "분류";
      if (type === "group") return "복합";
      return type;
    }

    function esc(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isGradable(q) {
      return q.type === "mc" || q.type === "ox" || q.type === "multi" || q.type === "group";
    }

    function renderTabs() {
      tabs.innerHTML = SECTIONS.map(s =>
        `<button class="tab ${state.filter === s.id ? "active" : ""}" data-section="${s.id}" type="button">${s.name}</button>`
      ).join("");
    }

    function visibleQuestions() {
      return state.filter === "all" ? QUIZ : QUIZ.filter(q => q.section === state.filter);
    }

    function optionButtons(qid, options, selected, graded, correctKey) {
      return options.map(opt => {
        let cls = "option";
        if (selected === opt.key) cls += " selected";
        if (graded) {
          if (opt.key === correctKey) cls += " correct";
          else if (selected === opt.key && selected !== correctKey) cls += " wrong";
        }
        return `<button type="button" class="${cls}" data-qid="${qid}" data-key="${esc(opt.key)}" ${graded ? "disabled" : ""}>
          <span class="mark">${esc(opt.key)}</span>
          <span>${esc(opt.text)}</span>
        </button>`;
      }).join("");
    }

    function renderCard(q, index) {
      const graded = !!state.graded[q.id];
      const result = state.graded[q.id];
      let body = "";
      let resultBadge = "";

      if (graded) {
        if (result === "ok") resultBadge = `<span class="badge result-ok">정답</span>`;
        else if (result === "bad") resultBadge = `<span class="badge result-bad">오답</span>`;
        else if (result === "partial") resultBadge = `<span class="badge result-pending">부분 정답</span>`;
        else resultBadge = `<span class="badge result-pending">해설 확인</span>`;
      }

      if (q.type === "mc" || q.type === "ox") {
        const opts = q.type === "ox"
          ? [{ key: "O", text: "O (옳다)" }, { key: "X", text: "X (틀리다)" }]
          : q.options;
        const selected = state.answers[q.id] ?? null;
        body = `<div class="options">${optionButtons(q.id, opts, selected, graded, q.answer)}</div>`;
      } else if (q.type === "desc") {
        const val = state.answers[q.id] ?? "";
        body = `<textarea class="desc-box" data-qid="${q.id}" placeholder="여기에 답을 적어보세요 (선택). 확인 버튼으로 모범 답안을 볼 수 있습니다." ${graded ? "readonly" : ""}>${esc(val)}</textarea>`;
      } else if (q.type === "multi") {
        const ans = state.answers[q.id] || {};
        body = q.parts.map(p => {
          const selected = ans[p.id] ?? null;
          const opts = q.choices.map(c => ({ key: c, text: c }));
          return `<div class="group-block">
            <h4>${esc(p.text)}</h4>
            <div class="options">${optionButtons(`${q.id}::${p.id}`, opts, selected, graded, p.answer)}</div>
          </div>`;
        }).join("");
      } else if (q.type === "group") {
        const ans = state.answers[q.id] || {};
        body = q.parts.map(p => {
          const pid = `${q.id}::${p.id}`;
          const selected = ans[p.id] ?? null;
          if (p.type === "mc" || p.type === "ox") {
            const opts = p.type === "ox"
              ? [{ key: "O", text: "O (옳다)" }, { key: "X", text: "X (틀리다)" }]
              : p.options;
            return `<div class="group-block">
              <h4>${esc(p.question)}</h4>
              <div class="options">${optionButtons(pid, opts, selected, graded, p.answer)}</div>
            </div>`;
          }
          if (p.type === "short") {
            return `<div class="group-block">
              <h4>${esc(p.question)}</h4>
              <input class="multi-input" data-qid="${pid}" type="text" value="${esc(selected ?? "")}" placeholder="답을 입력하세요" ${graded ? "readonly" : ""} />
              ${graded ? `<div class="feedback show info"><div class="label">정답</div>${esc(p.answer)}</div>` : ""}
            </div>`;
          }
          return `<div class="group-block">
            <h4>${esc(p.question)}</h4>
            <textarea class="desc-box" data-qid="${pid}" placeholder="답을 적어보세요" ${graded ? "readonly" : ""}>${esc(selected ?? "")}</textarea>
            ${graded ? `<div class="feedback show info"><div class="label">모범 답안</div>${esc(p.answerText)}</div>` : ""}
          </div>`;
        }).join("");
      }

      let feedbackHtml = "";
      if (graded) {
        const explain = q.explain || q.answerText || "";
        let cls = "info";
        let title = "해설";
        if (result === "ok") { cls = "ok"; title = "정답입니다"; }
        else if (result === "bad") { cls = "bad"; title = "오답입니다"; }
        else if (result === "partial") { cls = "info"; title = "부분 정답"; }
        else if (q.type === "desc") { title = "모범 답안"; }
        feedbackHtml = `<div class="feedback show ${cls}"><div class="label">${title}</div>${esc(explain)}</div>`;
      }

      return `<article class="card" data-id="${q.id}">
        <div class="q-meta">
          <span class="badge">${esc(q.label)}</span>
          <span class="badge type-${q.type === "ox" ? "ox" : q.type === "desc" ? "desc" : q.type === "multi" || q.type === "group" ? "multi" : "mc"}">${typeLabel(q.type)}</span>
          <span class="badge">${esc(q.sectionTitle)}</span>
          ${resultBadge}
        </div>
        <p class="q-title">${index + 1}. ${esc(q.question)}</p>
        ${q.extra ? `<p class="q-extra">${esc(q.extra)}</p>` : ""}
        ${body}
        <div class="card-actions">
          <button class="btn primary" type="button" data-grade="${q.id}">${graded ? "다시 보기" : "정답 확인"}</button>
          ${graded ? `<button class="btn ghost" type="button" data-ungrade="${q.id}">다시 풀기</button>` : ""}
        </div>
        ${feedbackHtml}
      </article>`;
    }

    function render() {
      renderTabs();
      const list = visibleQuestions();
      let html = "";
      let lastSection = null;
      list.forEach((q, i) => {
        if (state.filter === "all" && q.sectionTitle !== lastSection) {
          lastSection = q.sectionTitle;
          html += `<h2 class="section-title">${esc(q.sectionTitle)}</h2>`;
        }
        html += renderCard(q, i);
      });
      root.innerHTML = html || `<div class="card">표시할 문제가 없습니다.</div>`;
      updateScore();
    }

    function normalize(s) {
      return String(s || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function gradeQuestion(q, forceReveal = false) {
      if (q.type === "mc" || q.type === "ox") {
        const selected = state.answers[q.id];
        if (!selected && !forceReveal) {
          alert("답을 선택한 뒤 확인해 주세요.");
          return false;
        }
        state.graded[q.id] = selected === q.answer ? "ok" : "bad";
        return true;
      }
      if (q.type === "desc") {
        state.graded[q.id] = "info";
        return true;
      }
      if (q.type === "multi") {
        const ans = state.answers[q.id] || {};
        const answered = q.parts.every(p => ans[p.id]);
        if (!answered && !forceReveal) {
          alert("모든 항목을 분류한 뒤 확인해 주세요.");
          return false;
        }
        const correctCount = q.parts.filter(p => ans[p.id] === p.answer).length;
        if (correctCount === q.parts.length) state.graded[q.id] = "ok";
        else if (correctCount === 0) state.graded[q.id] = "bad";
        else state.graded[q.id] = "partial";
        return true;
      }
      if (q.type === "group") {
        const ans = state.answers[q.id] || {};
        let ok = 0, total = 0, missing = 0;
        q.parts.forEach(p => {
          if (p.type === "desc") return;
          total += 1;
          const val = ans[p.id];
          if (val == null || String(val).trim() === "") {
            missing += 1;
            return;
          }
          if (p.type === "mc" || p.type === "ox") {
            if (val === p.answer) ok += 1;
          } else if (p.type === "short") {
            const n = normalize(val);
            if ((p.accept || [p.answer]).some(a => n.includes(normalize(a)))) ok += 1;
          }
        });
        if (missing > 0 && !forceReveal) {
          alert("채점 가능한 항목을 모두 답한 뒤 확인해 주세요. (서술형은 선택)");
          return false;
        }
        if (ok === total) state.graded[q.id] = "ok";
        else if (ok === 0) state.graded[q.id] = "bad";
        else state.graded[q.id] = "partial";
        return true;
      }
      return false;
    }

    function updateScore() {
      const list = visibleQuestions().filter(isGradable);
      let correct = 0, wrong = 0, pending = 0;
      list.forEach(q => {
        const g = state.graded[q.id];
        if (g === "ok") correct += 1;
        else if (g === "bad" || g === "partial") wrong += 1;
        else pending += 1;
      });
      document.getElementById("gradableCount").textContent = list.length;
      document.getElementById("correctCount").textContent = correct;
      document.getElementById("wrongCount").textContent = wrong;
      document.getElementById("pendingCount").textContent = pending;
      const done = correct + wrong;
      const pct = list.length ? Math.round((done / list.length) * 100) : 0;
      document.getElementById("progressBar").style.width = pct + "%";
    }

    function setAnswer(qid, key) {
      if (qid.includes("::")) {
        const [parent, part] = qid.split("::");
        if (state.graded[parent]) return;
        state.answers[parent] = state.answers[parent] || {};
        state.answers[parent][part] = key;
      } else {
        if (state.graded[qid]) return;
        state.answers[qid] = key;
      }
      render();
    }

    root.addEventListener("click", (e) => {
      const opt = e.target.closest(".option");
      if (opt && !opt.disabled) {
        setAnswer(opt.dataset.qid, opt.dataset.key);
        return;
      }
      const gradeBtn = e.target.closest("[data-grade]");
      if (gradeBtn) {
        const q = QUIZ.find(x => x.id === gradeBtn.dataset.grade);
        if (!q) return;
        if (state.graded[q.id]) {
          q._scroll = true;
          return;
        }
        if (gradeQuestion(q)) render();
        return;
      }
      const ungradeBtn = e.target.closest("[data-ungrade]");
      if (ungradeBtn) {
        const id = ungradeBtn.dataset.ungrade;
        delete state.graded[id];
        render();
      }
    });

    root.addEventListener("input", (e) => {
      const el = e.target.closest("[data-qid]");
      if (!el) return;
      const qid = el.dataset.qid;
      if (qid.includes("::")) {
        const [parent, part] = qid.split("::");
        if (state.graded[parent]) return;
        state.answers[parent] = state.answers[parent] || {};
        state.answers[parent][part] = el.value;
      } else {
        if (state.graded[qid]) return;
        state.answers[qid] = el.value;
      }
    });

    tabs.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-section]");
      if (!btn) return;
      state.filter = btn.dataset.section;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("btnGradeAll").addEventListener("click", () => {
      visibleQuestions().forEach(q => {
        if (!state.graded[q.id]) gradeQuestion(q, true);
      });
      render();
    });

    document.getElementById("btnRevealAll").addEventListener("click", () => {
      visibleQuestions().forEach(q => { gradeQuestion(q, true); });
      render();
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      if (!confirm("현재 카테고리의 답안과 채점 결과를 초기화할까요?")) return;
      const ids = new Set(visibleQuestions().map(q => q.id));
      ids.forEach(id => {
        delete state.answers[id];
        delete state.graded[id];
      });
      render();
    });

    render();
  </script>
</body>
</html>
